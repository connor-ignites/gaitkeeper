name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.17.6 pytest==9.2.0
      - run: ruff check .
      - run: ruff format --check .
      # The maths tests; the Blender tests skip here and run in the job below.
      - run: pytest -q

  blender:
    name: Blender ${{ matrix.blender }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - blender: "4.2.9" # the oldest version the manifest allows
            series: "4.2"
          - blender: "5.2.3"
            series: "5.2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest==9.2.0
      - uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ matrix.blender }}
      - name: Download Blender
        run: |
          if [ ! -x ~/blender/blender ]; then
            mkdir -p ~/blender
            curl -fsSL "https://download.blender.org/release/Blender${{ matrix.series }}/blender-${{ matrix.blender }}-linux-x64.tar.xz" \
              | tar -xJ --strip-components=1 -C ~/blender
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxkbcommon0 libsm6 libgl1 libegl1 > /dev/null
      - name: Blender tests (install, check, fix, safety, edge cases, Pose Adapt pin)
        run: BLENDER=~/blender/blender pytest -q

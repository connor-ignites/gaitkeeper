name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff pytest
      - run: ruff check .
      - run: ruff format --check .
      # Blender isn't installed here, so the smoke test skips; the maths tests need no Blender.
      - run: pytest -q

# Tooling only: GaitKeeper ships as a Blender extension (see gaitkeeper/blender_manifest.toml),
# not as a pip package.

[project]
name = "gaitkeeper"
version = "0.9.0"
description = "Blender add-on that checks animation clips for sliding feet, pops, backward knees and other motion faults"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B905", # zip() pairs equal-length per-frame lists throughout; strict= adds noise, not safety
    "RUF012", # Blender operators declare bl_options as class-level sets by design
    "RUF001", # the reports use typographic characters on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-third-party = ["bpy", "mathutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
